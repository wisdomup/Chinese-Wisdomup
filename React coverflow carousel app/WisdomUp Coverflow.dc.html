<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;padding:0;background:#0E0A0C;}
html,body,*{cursor:none !important;}
a{color:#ff6a4d;text-decoration:none}
a:hover{color:#ffb3a1}
@keyframes wu-orbit{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes wu-breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wu-drift1{0%{transform:translate3d(-2.5%,1%,0) scale(1.02) skewX(0deg)}25%{transform:translate3d(1%,-2%,0) scale(1.07) skewX(-1.6deg)}50%{transform:translate3d(3%,.5%,0) scale(1.04) skewX(1.2deg)}75%{transform:translate3d(-.5%,-2.6%,0) scale(1.08) skewX(-.6deg)}100%{transform:translate3d(-2.5%,1%,0) scale(1.02) skewX(0deg)}}
@keyframes wu-drift2{0%{transform:translate3d(2.5%,1.5%,0) scaleY(1) skewX(1deg)}30%{transform:translate3d(-1.5%,-2.2%,0) scaleY(1.08) skewX(-1.8deg)}55%{transform:translate3d(-3%,.8%,0) scaleY(1.02) skewX(.8deg)}80%{transform:translate3d(1.5%,-3%,0) scaleY(1.1) skewX(-1deg)}100%{transform:translate3d(2.5%,1.5%,0) scaleY(1) skewX(1deg)}}
@keyframes wu-drift3{0%{transform:translate3d(-1.5%,1.5%,0) scale(1.02) skewX(-1deg)}20%{transform:translate3d(2%,-2.5%,0) scale(1.1) skewX(2deg)}45%{transform:translate3d(3.5%,.5%,0) scale(1.04) skewX(-1.4deg)}70%{transform:translate3d(-2%,-3.5%,0) scale(1.12) skewX(1.6deg)}100%{transform:translate3d(-1.5%,1.5%,0) scale(1.02) skewX(-1deg)}}
@keyframes wu-ember{0%,100%{opacity:.58}35%{opacity:.78}62%{opacity:.62}82%{opacity:.84}}
@keyframes wu-emberB{0%,100%{opacity:.9}40%{opacity:1}70%{opacity:.84}}
@keyframes wu-twinkle{0%,100%{opacity:.18}50%{opacity:.75}}
@keyframes wu-fadein{from{opacity:0}to{opacity:1}}
@keyframes wu-logospin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media (max-width:480px){
  .wu-hide-sm{display:none !important}
  .wu-bar{gap:3px !important;padding:4px !important}
  .wu-mod{padding:0 2px !important}
  .wu-pill{padding:0 6px 0 6px !important}
}
@media (max-width:600px){
  .wu-narrow{padding-left:12.5% !important;padding-right:12.5% !important;box-sizing:border-box;}
}
@keyframes wu-morph1{0%,100%{transform:translate(-6%,-4%) scale(1.05) rotate(0deg);border-radius:52% 48% 40% 60%}33%{transform:translate(8%,6%) scale(1.25) rotate(40deg);border-radius:38% 62% 58% 42%}66%{transform:translate(-4%,10%) scale(1.12) rotate(-25deg);border-radius:60% 40% 52% 48%}}
@keyframes wu-morph2{0%,100%{transform:translate(10%,8%) scale(1.15) rotate(12deg);border-radius:44% 56% 62% 38%}50%{transform:translate(-10%,-8%) scale(1.32) rotate(-30deg);border-radius:62% 38% 44% 56%}}
@keyframes wu-morph3{0%,100%{transform:translate(0,12%) scale(1.3) rotate(-18deg);border-radius:58% 42% 46% 54%}40%{transform:translate(12%,-10%) scale(1.02) rotate(28deg);border-radius:40% 60% 56% 44%}75%{transform:translate(-12%,2%) scale(1.22) rotate(6deg);border-radius:50% 50% 38% 62%}}
@keyframes wu-morph4{0%,100%{transform:translate(-12%,6%) scale(1.18) rotate(24deg);border-radius:46% 54% 50% 50%}45%{transform:translate(6%,-12%) scale(1.38) rotate(-14deg);border-radius:64% 36% 42% 58%}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.12s !important}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;width:100%;overflow:hidden;font-family:Archivo,system-ui,sans-serif;background:#0E0A0C;color:#fff;display:flex;flex-direction:column;align-items:center;" onPointerMove="{{ onPageMove }}">

  <sc-if value="{{ cursorOn }}" hint-placeholder-val="{{ false }}">
    <div ref="{{ cursorRef }}" aria-hidden="true" style="position:fixed;left:0;top:0;width:{{ cursorSize }}px;height:{{ cursorSize }}px;margin-left:{{ cursorNeg }}px;margin-top:{{ cursorNeg }}px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:999;will-change:transform;transition:width .18s ease,height .18s ease;"></div>
  </sc-if>

  <div aria-hidden="true" style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;animation:wu-fadein 1.2s ease both;">
    <div style="position:absolute;inset:0;background:#0E0A0C;"></div>
    <div style="position:absolute;inset:0;opacity:.5;background:{{ stars }};"></div>
    <div style="position:absolute;inset:0;background:{{ twinkle }};animation:{{ twinkleAnim }};"></div>
    <div style="position:absolute;inset:-15%;will-change:transform,opacity;filter:blur(clamp(60px,9vw,100px));animation:{{ d1 }};">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;"><path d="{{ w1 }}" fill="{{ cA }}"></path></svg>
    </div>
    <div style="position:absolute;inset:-15%;will-change:transform,opacity;filter:blur(clamp(48px,7vw,80px));animation:{{ d2 }};">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;"><path d="{{ w2 }}" fill="{{ cB }}"></path></svg>
    </div>
    <div style="position:absolute;inset:-15%;will-change:transform;opacity:{{ coreOp }};mix-blend-mode:plus-lighter;filter:blur(clamp(30px,4.5vw,50px));animation:{{ d3 }};">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;"><path d="{{ w3 }}" fill="{{ cC }}"></path></svg>
    </div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#0E0A0C 0%,rgba(14,10,12,.88) 12%,rgba(14,10,12,.62) 24%,rgba(14,10,12,.3) 36%,rgba(14,10,12,.1) 45%,rgba(14,10,12,0) 55%);"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(14,10,12,0) 0%,rgba(14,10,12,.35) 30%,rgba(14,10,12,.72) 60%,rgba(14,10,12,.92) 100%);"></div>
    <div style="position:absolute;inset:0;opacity:.04;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%222%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22/></svg>');"></div>
  </div>

  <header style="position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:9px;padding:39px 24px 0;">
    <div ref="{{ logoRef }}" onPointerMove="{{ onLogoMove }}" onPointerLeave="{{ onLogoLeave }}" style="position:relative;display:flex;align-items:center;gap:11px;perspective:400px;">
      <img src="assets/wisdomup-logo.png" alt="WisdomUp" style="position:relative;display:block;height:44px;width:auto;filter:drop-shadow(0 4px 14px rgba(255,45,30,.35));transition:transform .35s cubic-bezier(.22,.9,.32,1);will-change:transform;" />
    </div>
  </header>

  <div style="position:relative;z-index:2;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:24px 0 0;" class="wu-narrow">

    <div ref="{{ stageRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" role="listbox" aria-label="Product categories" tabindex="0" onKeyDown="{{ onKey }}" style="position:relative;width:100%;height:clamp(280px,44vh,400px);perspective:1500px;transform-style:preserve-3d;touch-action:pan-y;cursor:none;overscroll-behavior-x:contain;outline:none;user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);">
      <sc-for list="{{ cards }}" as="card" hint-placeholder-count="5">
        <div style="position:absolute;left:50%;top:50%;width:{{ cardW }}px;will-change:transform;transform-style:preserve-3d;transition:{{ trans }};transform:{{ card.transform }};opacity:{{ card.opacity }};z-index:{{ card.z }};pointer-events:{{ card.pe }};">
          <div onClick="{{ card.onClick }}" role="option" aria-selected="{{ card.selected }}" aria-label="{{ card.aria }}" style="position:relative;overflow:hidden;border-radius:15% / 11%;padding:10px 10px 14px;background:linear-gradient(165deg,rgba(28,8,12,.55),rgba(12,4,6,.62));backdrop-filter:{{ card.bf }};-webkit-backdrop-filter:{{ card.bf }};border:1px solid {{ card.border }};box-shadow:{{ card.shadow }};">
            <div style="position:absolute;inset:-18% -14%;opacity:.55;pointer-events:none;filter:{{ card.blur }} {{ card.hue }};background:{{ card.morph }};animation:{{ card.anim }};"></div>
            <div style="position:absolute;inset:-1.5px;border-radius:15% / 11%;padding:1.5px;opacity:{{ card.glow }};transition:opacity .45s ease;background:{{ ringGrad }};background-size:300% 100%;animation:wu-orbit 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;"></div>
            <div aria-hidden="true" style="position:absolute;left:-8%;right:-8%;bottom:-15px;height:20px;border-radius:999px;filter:blur(10px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:linear-gradient(90deg,transparent 10%,{{ accentBRgba }} 40%,{{ accentGlowRgba }} 58%,transparent 90%);"></div>
            <div aria-hidden="true" style="position:absolute;top:20%;bottom:20%;left:-12px;width:15px;border-radius:999px;filter:blur(9px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:{{ accentBRgba }};"></div>
            <div aria-hidden="true" style="position:absolute;top:20%;bottom:20%;right:-12px;width:15px;border-radius:999px;filter:blur(9px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:{{ accentBRgba }};"></div>
            <div style="position:relative;width:100%;aspect-ratio:1/1;border-radius:16% / 16%;overflow:hidden;background:rgba(0,0,0,.22);opacity:{{ card.slotOp }};transition:opacity .3s ease;">
              <image-slot id="{{ card.slotId }}" src="{{ card.slotSrc }}" shape="rounded" radius="26" placeholder="{{ card.slotHint }}"></image-slot>
            </div>
            <div style="position:relative;padding:15px 9px 2px;display:flex;flex-direction:column;gap:3px;text-align:center;opacity:{{ card.labelOp }};transition:opacity .3s ease;">
              <span style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff;text-shadow:{{ card.nameGlow }};">{{ card.name }}</span>
              <span style="font-size:11.8px;font-weight:500;letter-spacing:.02em;color:{{ card.metaColor }};">{{ card.meta }}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <p style="margin:15px 0 0;padding:0 24px;text-align:center;font-size:15px;font-weight:500;color:#fff;text-shadow:0 2px 16px rgba(14,10,12,.9),0 0 3px rgba(14,10,12,.7);text-wrap:pretty;">Premium mobile accessories for resellers</p>

    <div style="position:relative;width:100%;max-width:400px;padding:44px 15px 0;box-sizing:border-box;">
      <div aria-hidden="true" style="position:absolute;left:-4%;right:-4%;bottom:-16px;height:22px;border-radius:999px;filter:blur(11px);opacity:.32;pointer-events:none;background:linear-gradient(90deg,transparent 8%,{{ accentBRgba }} 40%,{{ accentGlowRgba }} 58%,transparent 92%);"></div>
      <div aria-hidden="true" style="position:absolute;top:22%;bottom:22%;left:-12px;width:16px;border-radius:999px;filter:blur(9px);opacity:.26;pointer-events:none;background:{{ accentBRgba }};"></div>
      <div aria-hidden="true" style="position:absolute;top:22%;bottom:22%;right:-12px;width:16px;border-radius:999px;filter:blur(9px);opacity:.26;pointer-events:none;background:{{ accentBRgba }};"></div>
      <div class="wu-bar" style="position:relative;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:4px;padding:5px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05) 45%,rgba(14,10,12,.34));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 50px rgba(0,0,0,.45),0 6px 16px {{ accentBRgba }},inset 0 1px 0 rgba(255,255,255,.2);">

        <div aria-hidden="true" style="position:absolute;inset:0;border-radius:999px;padding:1px;pointer-events:none;opacity:.8;filter:blur(.6px);background:linear-gradient(100deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.9) 42%,rgba(255,255,255,.2) 52%,rgba(255,255,255,0) 72%);background-size:300% 100%;animation:{{ ringAnim }};-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;"></div>

        <div class="wu-mod" style="display:flex;align-items:center;flex:none;height:28px;border-radius:999px;background:transparent;gap:2px;padding:0 3px;">
          <button type="button" onClick="{{ prev }}" aria-label="Previous category" style="display:grid;place-items:center;width:23px;height:23px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .18s,transform .15s;" style-hover="background:rgba(255,255,255,.18)" style-active="background:rgba(255,255,255,.26)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
          </button>
          <button type="button" onClick="{{ next }}" aria-label="Next category" style="display:grid;place-items:center;width:23px;height:23px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .18s,transform .15s;" style-hover="background:rgba(255,255,255,.18)" style-active="background:rgba(255,255,255,.26)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          </button>
        </div>

        <div class="wu-mod wu-pill" style="display:flex;align-items:center;flex:none;height:28px;border-radius:999px;background:transparent;flex:1 1 130px;min-width:0;overflow:hidden;gap:7px;padding:0 9px 0 4px;">
          <div style="min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px;overflow:hidden;">
            <span aria-live="polite" style="font-size:12.5px;font-weight:700;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ activeName }}</span>
            <span style="font-size:9.8px;font-weight:500;line-height:1.15;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ activeMeta }}</span>
          </div>
          <div class="wu-hide-sm" style="display:flex;align-items:flex-end;gap:2px;height:12px;flex:0 0 auto;">
            <sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
              <span style="display:block;width:2.5px;border-radius:2px;background:{{ b.c }};height:{{ b.h }}px;opacity:{{ b.o }};animation:wu-breathe {{ b.d }}s ease-in-out infinite;"></span>
            </sc-for>
          </div>
        </div>

        <div class="wu-mod wu-hide-sm" style="display:flex;align-items:center;flex:none;height:28px;border-radius:999px;background:transparent;gap:1px;padding:0 6px;">
          <button type="button" onClick="{{ decQty }}" aria-label="Decrease estimated cartons" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .18s,transform .15s;font-size:16px;line-height:1;" style-hover="background:rgba(255,255,255,.18)">−</button>
          <div style="display:flex;align-items:center;justify-content:center;min-width:22px;">
            <span style="font-size:12.5px;font-weight:700;line-height:1;">{{ qty }}</span>
          </div>
          <button type="button" onClick="{{ incQty }}" aria-label="Increase estimated cartons" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .18s,transform .15s;font-size:16px;line-height:1;" style-hover="background:rgba(255,255,255,.18)">+</button>
        </div>

        <a href="{{ waHref }}" target="_blank" rel="noopener" aria-label="Send WhatsApp inquiry" style="display:flex;align-items:center;flex:none;gap:7px;height:28px;padding:0 14px;border-radius:999px;background:{{ waBg }};border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.24);transition:transform .15s,filter .2s;" style-hover="transform:translateY(-1px);filter:brightness(1.1);color:#fff" style-active="transform:translateY(0)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          <span>Inquire</span>
        </a>

        <div class="wu-mod wu-hide-sm" style="display:flex;align-items:center;flex:none;height:28px;border-radius:999px;background:transparent;gap:2px;padding:0 3px;">
          <button type="button" onClick="{{ toggleSpecs }}" aria-label="Toggle category detail" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .18s,transform .15s;color:rgba(255,255,255,.85);" style-hover="background:rgba(255,255,255,.18);color:#fff">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          </button>
        </div>
      </div>

      <sc-if value="{{ specsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:15px;right:15px;top:100%;margin-top:9px;z-index:5;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;padding:15px 18px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05) 45%,rgba(14,10,12,.34));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);">
          <sc-for list="{{ activeSpecs }}" as="s" hint-placeholder-count="4">
            <div style="display:flex;flex-direction:column;gap:3px;">
              <span style="font-size:9.3px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700;">{{ s.k }}</span>
              <span style="font-size:11.8px;font-weight:600;color:rgba(255,255,255,.92);">{{ s.v }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display:flex;gap:6px;justify-content:center;align-items:center;margin-top:24px;padding:7px 11px;border-radius:999px;background:rgba(14,10,12,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="12">
        <button type="button" onClick="{{ d.go }}" aria-label="{{ d.aria }}" style="width:{{ d.w }}px;height:5px;padding:0;border:none;border-radius:3px;background:{{ d.bg }};cursor:pointer;transition:all .3s ease;"></button>
      </sc-for>
    </div>
  </div>

  <footer style="position:relative;z-index:3;width:100%;box-sizing:border-box;display:flex;justify-content:center;gap:10px;padding:39px 24px 24px;font-size:11.8px;color:rgba(255,255,255,.88);text-shadow:0 1px 10px rgba(14,10,12,.9);font-weight:500;">
    <span>© 2026 WisdomUp.cn</span><span style="opacity:.4">·</span><a href="https://wa.me/8615623305030" target="_blank" rel="noopener" style="color:#fff;border-bottom:1px solid rgba(255,255,255,.45);">Contact Us</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
const CATS = [
  { name: "Earbuds", skus: 46, specs: [["Carton", "200 pcs"], ["Lead time", "12-18 days"], ["Certs", "CE · FCC · RoHS"], ["OEM", "Logo + retail box"]] },
  { name: "Headphones", skus: 28, specs: [["Carton", "60 pcs"], ["Lead time", "15-22 days"], ["Certs", "CE · FCC"], ["OEM", "Logo + color"]] },
  { name: "Chargers", skus: 52, specs: [["Carton", "300 pcs"], ["Lead time", "10-15 days"], ["Certs", "CE · UL · PSE"], ["Plugs", "EU / US / UK / AU"]] },
  { name: "Power Banks", skus: 34, specs: [["Carton", "100 pcs"], ["Lead time", "15-20 days"], ["Certs", "UN38.3 · MSDS"], ["Shipping", "Sea only"]] },
  { name: "Speakers", skus: 31, specs: [["Carton", "40 pcs"], ["Lead time", "18-25 days"], ["Certs", "CE · FCC"], ["OEM", "Logo + packaging"]] },
  { name: "Data Cables", skus: 63, specs: [["Carton", "500 pcs"], ["Lead time", "8-12 days"], ["Certs", "CE · RoHS"], ["Types", "C / L / micro"]] },
  { name: "Keyboards", skus: 19, specs: [["Carton", "40 pcs"], ["Lead time", "20-28 days"], ["Certs", "CE · FCC"], ["Layouts", "US / UK / DE / AR"]] },
  { name: "Mice", skus: 22, specs: [["Carton", "100 pcs"], ["Lead time", "15-20 days"], ["Certs", "CE · FCC"], ["OEM", "Logo print"]] },
  { name: "Car Chargers", skus: 25, specs: [["Carton", "300 pcs"], ["Lead time", "10-15 days"], ["Certs", "CE · RoHS"], ["OEM", "Logo + box"]] },
  { name: "Smart Watches", skus: 17, specs: [["Carton", "60 pcs"], ["Lead time", "20-30 days"], ["Certs", "CE · FCC · RoHS"], ["OEM", "UI + strap"]] },
  { name: "Phone Cases", skus: 84, specs: [["Carton", "400 pcs"], ["Lead time", "8-14 days"], ["Certs", "RoHS"], ["Models", "iPhone / Samsung"]] },
  { name: "Screen Protectors", skus: 71, specs: [["Carton", "1000 pcs"], ["Lead time", "7-12 days"], ["Certs", "RoHS"], ["Types", "9H / privacy / matte"]] }
];
const WHATSAPP = "8615623305030";
const MORPH = [
  ["#ff5f6d", "#8e2de2"], ["#36d1dc", "#5b86e5"], ["#f7971e", "#ff2d55"], ["#7f7fd5", "#e684ae"],
  ["#11998e", "#38ef7d"], ["#ff6a00", "#ee0979"], ["#4776e6", "#8e54e9"], ["#f953c6", "#b91d73"],
  ["#00c6ff", "#0072ff"], ["#f0a30a", "#ff4e50"], ["#30cfd0", "#330867"], ["#ff9966", "#ff5e62"]
];

const PALETTES = {
  crimson: ["#8B0A1A", "#E0262F", "#FFF1F1"],
  rose: ["#B0124A", "#FF4D6D", "#FFF0F4"],
  ember: ["#C4121F", "#FF3636", "#FFE9D6"],
  solar: ["#FF2A00", "#FF8A00", "#FFF4E0"],
  wine: ["#4A0E1A", "#B23A48", "#FFE3E8"],
  scarlet: ["#6B0F3A", "#E0262F", "#FFD6DC"]
};
const DEFAULT_PALETTE = null;

function pickPalette() {
  const keys = Object.keys(PALETTES);
  let key = null;
  try {
    const q = new URLSearchParams(location.search).get("palette");
    if (q && PALETTES[q]) key = q;
  } catch (e) {}
  if (!key && DEFAULT_PALETTE) key = DEFAULT_PALETTE;
  if (!key) {
    let last = null;
    try { last = sessionStorage.getItem("wu-palette"); } catch (e) {}
    const pool = keys.filter(k => k !== last);
    key = pool[Math.floor(Math.random() * pool.length)];
    try { sessionStorage.setItem("wu-palette", key); } catch (e) {}
  }
  const p = PALETTES[key];
  const rgb = p[1].replace("#", "").match(/../g).map(h => parseInt(h, 16)).join(",");
  return { key: key, a: p[0], b: p[1], c: p[2], bRgb: rgb };
}

function wavePath(top, seed) {
  const xs = [-15, 8, 32, 56, 80, 115];
  const rnd = i => (Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453 % 1 + 1) % 1;
  const ys = xs.map((x, i) => top + (rnd(i) - 0.5) * 12);
  let d = "M" + xs[0] + "," + ys[0].toFixed(2);
  for (let i = 1; i < xs.length; i++) {
    const dx = (xs[i] - xs[i - 1]) / 2.2;
    d += " C" + (xs[i - 1] + dx).toFixed(2) + "," + (ys[i - 1] + (rnd(i + 9) - 0.5) * 8).toFixed(2) +
         " " + (xs[i] - dx).toFixed(2) + "," + (ys[i] + (rnd(i + 17) - 0.5) * 8).toFixed(2) +
         " " + xs[i] + "," + ys[i].toFixed(2);
  }
  return d + " L115,120 L-15,120 Z";
}

function starField(count, minO, maxO) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const x = (Math.random() * 100).toFixed(2), y = (Math.random() * 62).toFixed(2);
    const o = (minO + Math.random() * (maxO - minO)).toFixed(2);
    const s = Math.random() > 0.82 ? 2 : 1;
    out.push("radial-gradient(circle " + s + "px at " + x + "% " + y + "%,rgba(255,255,255," + o + ") 0 100%,transparent 100%)");
  }
  return out.join(",");
}

class Component extends DCLogic {
  state = { index: 0, pos: 0, qty: 1, dragging: false, cardW: 260, specsOpen: false, reduced: false, cursorOn: true, cursorX: 0, cursorY: 0 };
  stage = React.createRef();
  cursorRef = React.createRef();
  logoRef = React.createRef();
  onLogoMove = e => {
    const img = this.logoRef.current && this.logoRef.current.querySelector("img");
    if (!img) return;
    const r = this.logoRef.current.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    img.style.transition = "transform .05s linear";
    img.style.transform = "rotateY(" + (px * 26).toFixed(1) + "deg) rotateX(" + (-py * 26).toFixed(1) + "deg)";
  };
  onLogoLeave = () => {
    const img = this.logoRef.current && this.logoRef.current.querySelector("img");
    if (!img) return;
    img.style.transition = "transform .35s cubic-bezier(.22,.9,.32,1)";
    img.style.transform = "rotateY(0deg) rotateX(0deg)";
  };
  target = 0; vel = 0; raf = null;
  pal = pickPalette();
  waves = [wavePath(60, Math.random() * 100), wavePath(78, Math.random() * 100), wavePath(92, Math.random() * 100)];
  starsBg = starField(110, 0.2, 0.7);
  twinkleBg = starField(22, 0.4, 0.9);

  tick = () => {
    const n = CATS.length;
    if (this.state.dragging) { this.raf = requestAnimationFrame(this.tick); return; }
    let p = this.state.pos;
    if (this.fling) {
      p += this.vel;
      this.vel *= 0.96;
      if (Math.abs(this.vel) < 0.012) { this.fling = false; this.target = Math.round(p); }
    } else {
      const d = this.target - p;
      this.vel *= 0.5;
      p += d * 0.22 + this.vel;
      if (Math.abs(this.target - p) < 0.002 && Math.abs(this.vel) < 0.002) {
        p = this.target; this.vel = 0;
        this.setState({ pos: p, index: ((Math.round(p) % n) + n) % n });
        this.raf = null;
        return;
      }
    }
    this.setState({ pos: p, index: ((Math.round(p) % n) + n) % n });
    this.raf = requestAnimationFrame(this.tick);
  };
  run() { if (this.raf == null) this.raf = requestAnimationFrame(this.tick); }

  componentDidMount() {
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    this.setState({ reduced: mq.matches });
    this.resize = () => {
      const w = this.stage.current ? this.stage.current.clientWidth : 360;
      this.setState({ cardW: Math.max(150, Math.min(240, Math.round(w * 0.42))) });
    };
    this.resize();
    window.addEventListener("resize", this.resize);
  }
  componentWillUnmount() { window.removeEventListener("resize", this.resize); if (this.raf) cancelAnimationFrame(this.raf); }

  move(dir) { this.fling = false; this.target = Math.round(this.state.pos) + dir; this.vel = 0; this.run(); }
  goTo(i) {
    const n = CATS.length;
    const base = Math.round(this.state.pos);
    let d = i - (((base % n) + n) % n);
    if (d > n / 2) d -= n; if (d < -n / 2) d += n;
    this.fling = false; this.vel = 0; this.target = base + d; this.run();
  }

  onDown = e => {
    this.start = e.clientX; this.startPos = this.state.pos;
    this.lastX = e.clientX; this.lastT = performance.now();
    this.vel = 0; this.dragVel = 0; this.fling = false; this.moved = false;
    this.setState({ dragging: true }); this.run();
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  };
  cursorPos(e) {
    if (this.cursorRef.current) this.cursorRef.current.style.transform = "translate3d(" + e.clientX + "px," + e.clientY + "px,0)";
  }
  onPageMove = e => this.cursorPos(e);
  onMove = e => {
    this.cursorPos(e);
    if (!this.state.dragging) return;
    const now = performance.now(), dt = Math.max(6, now - this.lastT);
    const v = ((this.lastX - e.clientX) / this.spacing()) / dt * 16.67;
    this.dragVel = this.dragVel * 0.65 + v * 0.35;
    this.lastX = e.clientX; this.lastT = now;
    if (Math.abs(e.clientX - this.start) > 4) this.moved = true;
    this.setState({ pos: this.startPos - (e.clientX - this.start) / this.spacing() });
  };
  onUp = () => {
    if (!this.state.dragging) return;
    const stale = performance.now() - this.lastT > 90;
    const v = stale ? 0 : Math.max(-1.6, Math.min(1.6, (this.dragVel || 0) * 1.6));
    if (Math.abs(v) > 0.04) { this.vel = v; this.fling = true; }
    else { this.vel = 0; this.fling = false; this.target = Math.round(this.state.pos); }
    this.setState({ dragging: false });
    this.run();
  };
  onKey = e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); this.move(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); this.move(1); }
    else if (e.key === "Escape") this.setState({ specsOpen: false });
  };

  spacing() { return this.state.cardW * 0.6; }

  renderVals() {
    const n = CATS.length, s = this.state;
    const pos = s.pos;
    const sp = this.spacing();

    const cards = CATS.map((c, i) => {
      let d = i - pos;
      while (d > n / 2) d -= n;
      while (d < -n / 2) d += n;
      const a = Math.abs(d);
      const cl = Math.max(-3.2, Math.min(3.2, d));
      const u = Math.abs(cl);
      // accordion fold measured from the reference illustration
      const A = 66, A2 = 58;
      const fold = u <= 1 ? (1 - Math.cos(Math.PI * u * 0.5)) : 1 - (u - 1) * 0.1;
      const ry = s.reduced ? 0 : -Math.sign(cl) * (u <= 1 ? A * fold : A2 * fold);
      const off = (u <= 1 ? 0.71 * u : 0.71 + 0.4 * (u - 1)) * s.cardW;
      const tx = Math.sign(cl) * off;
      const ty = 0;
      const tz = s.reduced ? 0 : -u * 34;
      const sc = 1 - Math.min(u, 3.2) * 0.065;
      return {
        name: c.name,
        meta: c.skus + " SKUs · wholesale",
        aria: c.name + ", " + c.skus + " SKUs",
        selected: a < 0.5,
        morph: "radial-gradient(65% 55% at 32% 30%,color-mix(in oklab," + this.pal.b + " " + (86 - i * 5) + "%," + this.pal.a + ") 0%,transparent 70%),radial-gradient(70% 60% at 72% 74%,color-mix(in oklab," + this.pal.a + " " + (78 - i * 4) + "%," + this.pal.c + ") 0%,transparent 72%)",
        hue: "hue-rotate(" + ((i - 5.5) * 5).toFixed(1) + "deg)",
        nameGlow: a < 0.5 ? "0 0 18px rgba(" + this.pal.bRgb + ",.55)" : "none",
        metaColor: a < 0.5 ? this.pal.c : "rgba(255,255,255,.6)",
        anim: (s.reduced || a > 1.2) ? "none" : "wu-morph" + (i % 4 + 1) + " " + (14 + (i % 5) * 3) + "s ease-in-out " + (i % 7) * -1.8 + "s infinite alternate",
        bf: a < 1.6 ? "blur(16px) saturate(140%)" : "none",
        labelOp: a < 0.5 ? "1" : (a < 1.8 ? (0.5 - (a - 0.5) * 0.35).toFixed(2) : "0"),
        slotOp: a < 0.6 ? "1" : (a < 2 ? (0.72 - (a - 0.6) * 0.3).toFixed(2) : "0.3"),
        border: a < 0.5 ? "rgba(" + this.pal.bRgb + ",.5)" : "rgba(255,255,255,.16)",
        shadow: a < 0.5 ? "0 26px 60px rgba(0,0,0,.55),0 0 46px rgba(" + this.pal.bRgb + ",.38)" : "0 26px 60px rgba(0,0,0,.55)",
        blur: a < 1.2 ? "blur(22px)" : "none",
        underOp: a < 0.5 ? (0.35 * (1 - a / 0.5)).toFixed(2) : "0",
        slotId: "wu-cat-" + i,
        slotSrc: "assets/earbuds.avif",
        slotHint: "Drop " + c.name.toLowerCase() + " photo",
        transform: "translate(-50%,-50%) translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px," + tz.toFixed(0) + "px) rotateY(" + ry.toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")",
        opacity: a > 2.8 ? "0" : (a <= 2 ? 1 - a * 0.16 : Math.max(0, 0.68 - (a - 2) * 0.85)).toFixed(2),
        z: String(100 - Math.round(a * 10)),
        pe: a > 2.8 ? "none" : "auto",
        glow: a < 0.35 ? (1 - a / 0.35).toFixed(2) : "0",
        onClick: () => { if (!this.moved && a >= 0.5) this.goTo(i); }
      };
    });

    const act = CATS[s.index];
    const msg = "Hi WisdomUp, I'm interested in " + act.name + " — " + s.qty + " carton" + (s.qty > 1 ? "s" : "") + ".";

    const P = this.pal;
    return {
      cA: P.a, cB: P.b, cC: P.c,
      ringGrad: "linear-gradient(115deg," + P.a + "," + P.b + "," + P.c + "," + P.b + "," + P.a + ")",
      accentB: P.b, accentA: P.a, accentGlow: P.c,
      pillBg: "color-mix(in srgb, " + P.a + " 22%, #0E0A0C)",
      waBg: "linear-gradient(140deg," + P.b + "," + P.a + ")",
      w1: this.waves[0], w2: this.waves[1], w3: this.waves[2],
      stars: this.starsBg,
      twinkle: this.twinkleBg,
      ringAnim: s.reduced ? "none" : "wu-orbit 7s linear infinite",
      logoSpin: s.reduced ? "none" : "wu-logospin 10s linear infinite",
      accentBRgba: "rgba(" + P.bRgb + ",.4)",
      accentGlowRgba: "color-mix(in srgb, " + P.c + " 65%, transparent)",
      coreOp: s.reduced ? 0.45 : 0.5,
      twinkleAnim: s.reduced ? "none" : "wu-twinkle 5.5s ease-in-out infinite",
      d1: s.reduced ? "none" : "wu-drift1 34s cubic-bezier(.45,.05,.55,.95) infinite, wu-emberB 11s ease-in-out infinite",
      d2: s.reduced ? "none" : "wu-drift2 26s cubic-bezier(.45,.05,.55,.95) infinite, wu-emberB 8.5s ease-in-out -2s infinite",
      d3: s.reduced ? "none" : "wu-drift3 21s cubic-bezier(.45,.05,.55,.95) infinite, wu-ember 6.5s ease-in-out -1.2s infinite",
      cards,
      cardW: s.cardW,
      trans: "none",
      stageRef: this.stage,
      onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, onKey: this.onKey,
      onPageMove: this.onPageMove,
      cursorRef: this.cursorRef,
      logoRef: this.logoRef, onLogoMove: this.onLogoMove, onLogoLeave: this.onLogoLeave,
      cursorOn: s.cursorOn,
      cursorSize: s.dragging ? 20 : 30, cursorNeg: s.dragging ? -10 : -15,
      cursorDot: s.dragging ? 4 : 5, cursorDotNeg: s.dragging ? -2 : -2.5,
      prev: () => this.move(-1),
      next: () => this.move(1),
      qty: s.qty,
      incQty: () => this.setState(p => ({ qty: Math.min(999, p.qty + 1) })),
      decQty: () => this.setState(p => ({ qty: Math.max(1, p.qty - 1) })),
      activeName: act.name,
      activeMeta: act.skus + " SKUs in stock",
      activeInitials: act.name.slice(0, 2).toUpperCase(),
      activeSpecs: act.specs.map(p => ({ k: p[0], v: p[1] })),
      specsOpen: s.specsOpen,
      toggleSpecs: () => this.setState(p => ({ specsOpen: !p.specsOpen })),
      waHref: "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg),
      bars: [5, 9, 7, 12, 8, 4].map((h, i) => ({ h, c: P.c, o: (0.5 + (i % 3) * 0.2).toFixed(2), d: (0.8 + i * 0.13).toFixed(2) })),
      dots: CATS.map((c, i) => ({
        go: () => this.goTo(i),
        aria: "Go to " + c.name,
        w: i === s.index ? 22 : 6,
        bg: i === s.index ? P.c : "rgba(255,255,255,.38)"
      }))
    };
  }
}
