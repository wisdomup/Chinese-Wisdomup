<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;padding:0;background:#0E0A0C;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;}
::selection{background:rgba(255,255,255,.18);color:#fff}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:3px;border-radius:999px}
html,body,*{cursor:none !important;}
a{color:#ff6a4d;text-decoration:none}
a:hover{color:#ffb3a1}
@keyframes wu-orbit{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes wu-breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wu-drift1{0%{transform:translate3d(-2.5%,1%,0) scale(1.02) skewX(0deg)}25%{transform:translate3d(1%,-2%,0) scale(1.07) skewX(-1.6deg)}50%{transform:translate3d(3%,.5%,0) scale(1.04) skewX(1.2deg)}75%{transform:translate3d(-.5%,-2.6%,0) scale(1.08) skewX(-.6deg)}100%{transform:translate3d(-2.5%,1%,0) scale(1.02) skewX(0deg)}}
@keyframes wu-drift2{0%{transform:translate3d(2.5%,1.5%,0) scaleY(1) skewX(1deg)}30%{transform:translate3d(-1.5%,-2.2%,0) scaleY(1.08) skewX(-1.8deg)}55%{transform:translate3d(-3%,.8%,0) scaleY(1.02) skewX(.8deg)}80%{transform:translate3d(1.5%,-3%,0) scaleY(1.1) skewX(-1deg)}100%{transform:translate3d(2.5%,1.5%,0) scaleY(1) skewX(1deg)}}
@keyframes wu-drift3{0%{transform:translate3d(-1.5%,1.5%,0) scale(1.02) skewX(-1deg)}20%{transform:translate3d(2%,-2.5%,0) scale(1.1) skewX(2deg)}45%{transform:translate3d(3.5%,.5%,0) scale(1.04) skewX(-1.4deg)}70%{transform:translate3d(-2%,-3.5%,0) scale(1.12) skewX(1.6deg)}100%{transform:translate3d(-1.5%,1.5%,0) scale(1.02) skewX(-1deg)}}
@keyframes wu-ember{0%,100%{opacity:.58}35%{opacity:.78}62%{opacity:.62}82%{opacity:.84}}
@keyframes wu-emberB{0%,100%{opacity:.9}40%{opacity:1}70%{opacity:.84}}
@keyframes wu-twinkle{0%,100%{opacity:.18}50%{opacity:.75}}
@keyframes wu-fadein{from{opacity:0}to{opacity:1}}
@keyframes wu-logospin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media (max-width:480px){
  .wu-hide-sm{display:none !important}
  .wu-bar{gap:3px !important;padding:4px !important}
  .wu-mod{padding:0 2px !important}
  .wu-pill{padding:0 6px 0 6px !important}
}
@media (max-width:600px){
  .wu-narrow{padding-left:12.5% !important;padding-right:12.5% !important;box-sizing:border-box;}
}
@keyframes wu-morph1{0%,100%{transform:translate(-6%,-4%) scale(1.05) rotate(0deg);border-radius:52% 48% 40% 60%}33%{transform:translate(8%,6%) scale(1.25) rotate(40deg);border-radius:38% 62% 58% 42%}66%{transform:translate(-4%,10%) scale(1.12) rotate(-25deg);border-radius:60% 40% 52% 48%}}
@keyframes wu-morph2{0%,100%{transform:translate(10%,8%) scale(1.15) rotate(12deg);border-radius:44% 56% 62% 38%}50%{transform:translate(-10%,-8%) scale(1.32) rotate(-30deg);border-radius:62% 38% 44% 56%}}
@keyframes wu-morph3{0%,100%{transform:translate(0,12%) scale(1.3) rotate(-18deg);border-radius:58% 42% 46% 54%}40%{transform:translate(12%,-10%) scale(1.02) rotate(28deg);border-radius:40% 60% 56% 44%}75%{transform:translate(-12%,2%) scale(1.22) rotate(6deg);border-radius:50% 50% 38% 62%}}
@keyframes wu-morph4{0%,100%{transform:translate(-12%,6%) scale(1.18) rotate(24deg);border-radius:46% 54% 50% 50%}45%{transform:translate(6%,-12%) scale(1.38) rotate(-14deg);border-radius:64% 36% 42% 58%}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.12s !important}}
@media (pointer:coarse){
  html,body,*{cursor:auto !important;}
  .wu-bar button{width:40px !important;height:40px !important;}
  .wu-mod,.wu-cta{height:44px !important;}
  .wu-cta{padding:0 24px !important;}
  .wu-dot{height:11px !important;}
  .wu-capsule{max-width:650px !important;}
  .wu-logo-img{height:34px !important;}
}
</style>
</helmet>
<div style="position:relative;height:100vh;width:100%;overflow:hidden;font-family:Archivo,system-ui,sans-serif;background:#0E0A0C;color:#fff;display:flex;flex-direction:column;align-items:center;" onPointerMove="{{ onPageMove }}">

  <sc-if value="{{ cursorOn }}" hint-placeholder-val="{{ false }}">
    <div ref="{{ cursorRef }}" aria-hidden="true" style="position:fixed;left:0;top:0;width:{{ cursorSize }}px;height:{{ cursorSize }}px;margin-left:{{ cursorNeg }}px;margin-top:{{ cursorNeg }}px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:999;will-change:transform;transition:width .18s ease,height .18s ease;"></div>
  </sc-if>

  <div aria-hidden="true" style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;animation:wu-fadein 1.2s ease both;">
    <div style="position:absolute;inset:0;background:#0E0A0C;"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.06) 0%,transparent 55%),radial-gradient(90% 70% at 50% 100%,rgba(0,0,0,.6) 0%,transparent 60%);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#0E0A0C 0%,rgba(14,10,12,.88) 12%,rgba(14,10,12,.62) 24%,rgba(14,10,12,.3) 36%,rgba(14,10,12,.1) 45%,rgba(14,10,12,0) 55%);"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(14,10,12,0) 0%,rgba(14,10,12,.35) 30%,rgba(14,10,12,.72) 60%,rgba(14,10,12,.92) 100%);"></div>
    <div style="position:absolute;inset:0;opacity:.03;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%222%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22/></svg>');"></div>
  </div>

  <header style="position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 21px 0;flex:none;">
    <div ref="{{ logoRef }}" onPointerMove="{{ onLogoMove }}" onPointerEnter="{{ onCursorBig }}" onPointerLeave="{{ onLogoLeave }}" style="position:relative;display:flex;align-items:center;gap:11px;perspective:400px;">
      <img class="wu-logo-img" src="assets/wisdomup-logo.png" alt="WisdomUp" style="position:relative;display:block;height:32px;width:auto;filter:drop-shadow(0 2px 7px rgba(255,45,30,.175));transition:transform .35s cubic-bezier(.22,.9,.32,1);will-change:transform;" />
    </div>
  </header>

  <div style="position:relative;z-index:2;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:2px 0 0;" class="wu-narrow">

    <div ref="{{ stageRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" role="listbox" aria-label="Product categories" tabindex="0" onKeyDown="{{ onKey }}" style="position:relative;width:100%;height:{{ stageHeight }};perspective:1500px;transform-style:preserve-3d;touch-action:pan-y;cursor:none;overscroll-behavior-x:contain;outline:none;user-select:none;">
      <sc-for list="{{ cards }}" as="card" hint-placeholder-count="5">
        <div style="position:absolute;left:50%;top:50%;width:{{ cardW }}px;will-change:transform;transform-style:preserve-3d;transition:{{ trans }};transform:{{ card.transform }};opacity:{{ card.opacity }};z-index:{{ card.z }};pointer-events:{{ card.pe }};">
          <div onClick="{{ card.onClick }}" onPointerEnter="{{ card.onEnter }}" onPointerLeave="{{ card.onLeave }}" role="option" aria-selected="{{ card.selected }}" aria-label="{{ card.aria }}" style="position:relative;overflow:hidden;border-radius:13% / 10%;padding:8px 8px 13px;background:linear-gradient(165deg,rgba(28,8,12,.55),rgba(12,4,6,.62));backdrop-filter:{{ card.bf }};-webkit-backdrop-filter:{{ card.bf }};border:1px solid {{ card.border }};box-shadow:{{ card.shadow }};">
            <div style="position:absolute;inset:-5px;border-radius:13% / 10%;padding:2px;opacity:{{ card.glow }};transition:opacity .45s ease;filter:blur(6px);background:{{ ringGrad }};background-size:300% 100%;animation:wu-orbit 20s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;"></div>
            <div aria-hidden="true" style="position:absolute;left:-8%;right:-8%;bottom:-15px;height:20px;border-radius:999px;filter:blur(20px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:radial-gradient(50% 100% at 50% 50%,{{ accentGlowRgba }} 0%,transparent 75%);"></div>
            <div aria-hidden="true" style="position:absolute;top:24%;bottom:24%;left:-16px;width:24px;border-radius:999px;filter:blur(18px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:radial-gradient(circle,{{ accentGlowRgba }} 0%,transparent 72%);"></div>
            <div aria-hidden="true" style="position:absolute;top:24%;bottom:24%;right:-16px;width:24px;border-radius:999px;filter:blur(18px);opacity:{{ card.underOp }};transition:opacity .45s ease;pointer-events:none;background:radial-gradient(circle,{{ accentGlowRgba }} 0%,transparent 72%);"></div>
            <div style="position:relative;width:100%;aspect-ratio:1/1.25;border-radius:10% / 10%;overflow:hidden;background:rgba(0,0,0,.22);opacity:{{ card.slotOp }};transition:opacity .3s ease;">
              <image-slot id="{{ card.slotId }}" src="{{ card.slotSrc }}" shape="rounded" radius="22" placeholder="{{ card.slotHint }}"></image-slot>
            </div>
            <div style="position:relative;padding:13px 8px 0;display:flex;flex-direction:column;gap:3px;text-align:center;opacity:{{ card.labelOp }};transition:opacity .3s ease;">
              <span style="font-size:17px;font-weight:600;letter-spacing:-.015em;color:#fff;text-shadow:{{ card.nameGlow }};">{{ card.name }}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;gap:0;justify-content:center;align-items:center;width:auto;max-width:100%;box-sizing:border-box;margin-top:-4px;padding:2px 10px;border-radius:999px;background:rgba(14,10,12,.7);border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="12">
        <button type="button" class="wu-dot" onClick="{{ d.go }}" aria-label="{{ d.aria }}" style="position:relative;display:grid;place-items:center;flex:0 0 auto;width:11px;height:11px;padding:0;border:none;background:transparent;cursor:pointer;"><span style="display:block;width:{{ d.w }}px;height:4px;border-radius:2px;background:{{ d.bg }};transition:width .3s cubic-bezier(.22,.9,.32,1),background .3s ease;"></span></button>
      </sc-for>
    </div>
    <p style="position:relative;z-index:3;margin:8px 0 0;padding:0 21px;text-align:center;text-wrap:pretty;"><span style="display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 8px rgba(14,10,12,.8);">Wholesale Mobile Accessories</span><span style="display:block;margin-top:2px;font-size:12px;font-weight:300;letter-spacing:.005em;color:rgba(255,255,255,.55);">Factory Direct · Low MOQ · 24/7 Online Service</span></p>

    <div class="wu-capsule" style="position:relative;width:100%;max-width:520px;padding:8px 13px 0;box-sizing:border-box;flex:none;">
      <div ref="{{ glowRef }}" aria-hidden="true" style="position:absolute;z-index:0;top:8px;left:13px;right:13px;bottom:0;pointer-events:none;filter:blur(4.5px) saturate(1.25) brightness(1.35);opacity:.85;">
        <sc-for list="{{ glowDots }}" as="g" hint-placeholder-count="170">
          <div style="position:absolute;top:0;left:0;width:0;height:0;offset-path:{{ g.path }};offset-distance:{{ g.start }};">
            <span style="display:block;position:absolute;left:{{ g.neg }}px;top:{{ g.neg }}px;width:{{ g.size }}px;height:{{ g.size }}px;border-radius:50%;background:{{ g.color }};opacity:{{ g.op }};-webkit-mask:radial-gradient(closest-side,#000 35%,rgba(0,0,0,.35) 70%,transparent 100%);mask:radial-gradient(closest-side,#000 35%,rgba(0,0,0,.35) 70%,transparent 100%);"></span>
          </div>
        </sc-for>
      </div>
      <div ref="{{ rimRef }}" aria-hidden="true" style="position:absolute;z-index:0;top:8px;left:13px;right:13px;bottom:0;pointer-events:none;filter:blur(1.25px) saturate(1.3) brightness(1.45);">
        <sc-for list="{{ rimDots }}" as="g" hint-placeholder-count="170">
          <div style="position:absolute;top:0;left:0;width:0;height:0;offset-path:{{ g.path }};offset-distance:{{ g.start }};">
            <span style="display:block;position:absolute;left:{{ g.neg }}px;top:{{ g.neg }}px;width:{{ g.size }}px;height:{{ g.size }}px;border-radius:50%;background:{{ g.color }};opacity:{{ g.op }};-webkit-mask:radial-gradient(closest-side,#000 40%,rgba(0,0,0,.4) 75%,transparent 100%);mask:radial-gradient(closest-side,#000 40%,rgba(0,0,0,.4) 75%,transparent 100%);"></span>
          </div>
        </sc-for>
      </div>
      <div class="wu-bar" onPointerEnter="{{ onCursorBig }}" onPointerLeave="{{ onCursorSmall }}" style="position:relative;z-index:1;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:5px;padding:5px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05) 45%,rgba(14,10,12,.62));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 50px rgba(0,0,0,.45),0 6px 16px {{ accentBRgba }},inset 0 1px 0 rgba(255,255,255,.2);">

        <div class="wu-mod" style="position:relative;z-index:1;display:flex;align-items:center;flex:none;height:34px;border-radius:999px;background:transparent;gap:2px;padding:0 3px;">
          <button type="button" class="wu-hide-sm" onClick="{{ prev }}" aria-label="Previous category" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);" style-hover="background:rgba(255,255,255,.18)" style-active="background:rgba(255,255,255,.26)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
          </button>
          <button type="button" onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);" style-hover="background:rgba(255,255,255,.18)" style-active="background:rgba(255,255,255,.26)">
            <sc-if value="{{ autoplayPaused }}" hint-placeholder-val="{{ false }}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
            </sc-if>
            <sc-if value="{{ autoplayPlaying }}" hint-placeholder-val="{{ true }}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </sc-if>
          </button>
          <button type="button" class="wu-hide-sm" onClick="{{ next }}" aria-label="Next category" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);" style-hover="background:rgba(255,255,255,.18)" style-active="background:rgba(255,255,255,.26)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          </button>
        </div>

        <div class="wu-mod wu-pill" style="position:relative;z-index:1;display:flex;align-items:center;flex:none;height:34px;border-radius:999px;background:transparent;flex:1 1 130px;min-width:0;overflow:hidden;gap:7px;padding:0 9px 0 4px;">
          <div style="min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px;overflow:hidden;">
            <span aria-live="polite" style="font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ activeName }}</span>
          </div>
        </div>

        <div class="wu-mod wu-hide-sm" style="position:relative;z-index:1;display:flex;align-items:center;flex:none;height:34px;border-radius:999px;background:transparent;gap:1px;padding:0 6px;">
          <button type="button" onClick="{{ decQty }}" aria-label="Decrease estimated cartons" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);font-size:16px;line-height:1;" style-hover="background:rgba(255,255,255,.18)">−</button>
          <div style="display:flex;align-items:center;justify-content:center;min-width:22px;">
            <span style="font-size:13px;font-weight:600;line-height:1;">{{ qty }}</span>
          </div>
          <button type="button" onClick="{{ incQty }}" aria-label="Increase estimated cartons" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);font-size:16px;line-height:1;" style-hover="background:rgba(255,255,255,.18)">+</button>
        </div>

        <a class="wu-cta" href="{{ waHref }}" target="_blank" rel="noopener" aria-label="Send WhatsApp inquiry" style="position:relative;z-index:1;box-sizing:border-box;display:flex;align-items:center;flex:none;gap:7px;height:34px;padding:0 21px;border-radius:999px;background:{{ waBg }};border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;letter-spacing:.012em;box-shadow:inset 0 1px 0 rgba(255,255,255,.24);transition:transform .15s,filter .2s;" style-hover="transform:translateY(-1px);filter:brightness(1.1);color:#fff" style-active="transform:translateY(0)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          <span>Inquire</span>
        </a>

        <div class="wu-mod wu-hide-sm" style="position:relative;z-index:1;display:flex;align-items:center;flex:none;height:34px;border-radius:999px;background:transparent;gap:2px;padding:0 3px;">
          <button type="button" onClick="{{ toggleSpecs }}" aria-label="Toggle category detail" style="display:grid;place-items:center;width:26px;height:26px;border:none;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background .22s cubic-bezier(.22,.9,.32,1),transform .18s cubic-bezier(.22,.9,.32,1);color:rgba(255,255,255,.85);" style-hover="background:rgba(255,255,255,.18);color:#fff">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          </button>
        </div>
      </div>

      <sc-if value="{{ specsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:15px;right:15px;top:100%;margin-top:13px;z-index:5;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:21px;padding:21px;border-radius:21px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05) 45%,rgba(14,10,12,.34));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);">
          <sc-for list="{{ activeSpecs }}" as="s" hint-placeholder-count="4">
            <div style="display:flex;flex-direction:column;gap:3px;">
              <span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700;">{{ s.k }}</span>
              <span style="font-size:13px;font-weight:500;color:rgba(255,255,255,.92);">{{ s.v }}</span>
            </div>
          </sc-for>
        </div>

      cursorDot: s.dragging ? 4 : 5, cursorDotNeg: s.dragging ? -2 : -2.5,
      onCursorBig: this.onCursorBig, onCursorSmall: this.onCursorSmall,
      togglePlay: this.togglePlay,
      autoplayPaused: s.autoplayPaused,
      autoplayPlaying: !s.autoplayPaused,
      playLabel: s.autoplayPaused ? "Play auto-advance" : "Pause auto-advance",
      prev: () => this.move(-1),
      next: () => this.move(1),
      qty: s.qty,
      incQty: () => this.setState(p => ({ qty: Math.min(999, p.qty + 1) })),
      decQty: () => this.setState(p => ({ qty: Math.max(1, p.qty - 1) })),
      activeName: act.name,
      activeMeta: act.skus + " SKUs in stock",
      activeInitials: act.name.slice(0, 2).toUpperCase(),
      activeSpecs: act.specs.map(p => ({ k: p[0], v: p[1] })),
      specsOpen: s.specsOpen,
      toggleSpecs: () => this.setState(p => ({ specsOpen: !p.specsOpen })),
      waHref: "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg),
      bars: [5, 9, 7, 12, 8, 4].map((h, i) => ({ h, c: P.c, o: (0.5 + (i % 3) * 0.2).toFixed(2), d: (0.8 + i * 0.13).toFixed(2) })),
      dots: CATS.map((c, i) => ({
        go: () => this.goTo(i),
        aria: "Go to " + c.name,
        w: i === s.index ? 11 : 3,
        bg: i === s.index ? P.c : "#8a8688"
      }))
    };
  }
}
</script>
</body>
</html>
